<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js">
<title>PCForge — 3D PC Builder</title>
<meta name="description" content="Interactive 3D PC configurator with compatibility checks, price totals and saved builds. Demo data only.">
<style>
:root{--bg:#0a0b0e;--p:#101216;--p2:#161920;--b:#232731;--b2:#313745;--t:#e9ebef;--m:#8a93a3;--a:#5eead4;--a2:#8b5cf6;--ok:#34d399;--w:#fbbf24;--bad:#f87171;--u:#94a3b8;--r:10px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--t);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:6px 10px;transition:.15s}
button:hover{border-color:var(--b2);background:#1c202a}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:linear-gradient(135deg,var(--a),#38bdf8);color:#03201c;border:0;font-weight:700}
button.pri:hover{filter:brightness(1.1)}
input,select{background:#0c0e12;border:1px solid var(--b);border-radius:8px;padding:6px 9px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--m)}
/* top bar */
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--b);background:linear-gradient(#12141a,#0d0f13);overflow-x:auto;flex:none;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px;font-size:15px;margin-right:6px}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 200deg,var(--a),var(--a2),var(--a));box-shadow:0 0 14px #5eead466;display:inline-block}
.brand em{font-style:normal;font-size:10px;color:var(--a);border:1px solid #5eead455;border-radius:4px;padding:0 5px}
#bname{font-weight:600;width:190px}
#save{font-size:11px;color:var(--m);min-width:92px}
#save.ok::before{content:"●";color:var(--ok);margin-right:5px}
#gsearch{width:190px}
.sp{flex:1}
/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;position:relative}
#view{position:relative;min-height:0;overflow:hidden;background:radial-gradient(900px 500px at 50% 30%,#171b24,#0a0b0e)}
#gl{position:absolute;inset:0;outline:none}
#gl canvas{display:block;width:100%;height:100%}
#panel{border-left:1px solid var(--b);display:flex;flex-direction:column;min-height:0;background:var(--p)}
#pscroll{flex:1;overflow:auto;padding:12px}
#foot{border-top:1px solid var(--b);padding:12px;background:#0d0f13}
.bar{height:6px;background:#1b1f27;border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .4s}
/* toolbar */
.tb{position:absolute;z-index:5;display:flex;flex-wrap:wrap;gap:5px}
#tbTop{top:10px;left:10px;right:56px}
.chip{background:#12151bf2;padding:4px 9px;font-size:12px;border-radius:999px}
.chip[aria-pressed=true]{border-color:var(--a);color:var(--a);background:#5eead414}
#tbBot{bottom:10px;left:10px;align-items:center;background:#12151bf2;border:1px solid var(--b);border-radius:12px;padding:6px 10px;gap:12px}
#tbBot label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--m)}
#tbBot input[type=range]{width:90px;padding:0}
#tbBot input[type=color]{width:26px;height:22px;padding:0;border:0;background:none}
.sw{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid var(--b2)}
.sw[aria-pressed=true]{border-color:var(--a)}
#fs{position:absolute;top:10px;right:10px;z-index:5}
#fid{position:absolute;right:12px;bottom:10px;z-index:4;font-size:11px;color:var(--m);max-width:300px;text-align:right;pointer-events:none}
#fid b{color:var(--w)}
#tip{position:absolute;z-index:6;pointer-events:none;background:#000c;border:1px solid var(--b2);padding:3px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:10px;padding:1px 6px;border-radius:5px;background:#0009;border:1px solid #ffffff22;color:#cfd6e2;white-space:nowrap}
#loading{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#0a0b0e;color:var(--m);text-align:center;padding:20px}
#loading.failed{z-index:3;pointer-events:none}
#loading .spin{width:34px;height:34px;border:3px solid #232731;border-top-color:var(--a);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* slots */
h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--m)}
.slot{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--b);border-radius:var(--r);margin-bottom:7px;background:var(--p2);cursor:pointer;transition:.15s}
.slot:hover{border-color:var(--b2)}
.slot.sel{border-color:var(--a);box-shadow:0 0 0 1px #5eead433,0 0 18px #5eead414}
.slot .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.5px;background:#0c0e12;border:1px solid var(--b);color:var(--m);flex:none}
.slot.has .ic{color:var(--a);border-color:#5eead455}
.slot .tx{flex:1;min-width:0}
.slot .tx small{display:block;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.slot .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.slot .pr{text-align:right;font-size:12px}
.slot .x{padding:2px 7px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid;letter-spacing:.03em}
.b-compatible{color:var(--ok);border-color:#34d39966}
.b-warning{color:var(--w);border-color:#fbbf2466}
.b-incompatible{color:var(--bad);border-color:#f8717166}
.b-unknown{color:var(--u);border-color:#94a3b866}
.b-demo{color:#c4b5fd;border-color:#8b5cf666}
.issue{border:1px solid var(--b);border-left-width:3px;border-radius:8px;padding:8px 10px;margin-bottom:7px;background:var(--p2)}
.issue.incompatible{border-left-color:var(--bad)}.issue.warning{border-left-color:var(--w)}.issue.unknown{border-left-color:var(--u)}.issue.compatible{border-left-color:var(--ok)}
.issue p{margin:3px 0;color:#c3c9d4}
.issue small{color:var(--m);display:block}
.issue .fix{color:var(--a)}
details summary{cursor:pointer;color:var(--m);font-size:12px;margin:8px 0}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:22px;letter-spacing:-.5px}
.row{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin:2px 0}
.warnbox{background:#fbbf2412;border:1px solid #fbbf2455;color:#fcd34d;border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0}
.mini{width:62px;padding:3px 6px;text-align:right}
.empty{border:1px dashed var(--b2);border-radius:var(--r);padding:14px;text-align:center;color:var(--m);margin-bottom:12px}
.empty .btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* drawer */
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);z-index:20;background:#0e1014;border-left:1px solid var(--b2);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px #0008}
#drawer.open{transform:none}
#drawer header{padding:12px;border-bottom:1px solid var(--b);display:flex;gap:8px;align-items:center}
#drawer header b{flex:1;font-size:15px}
#dctl{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:7px;border-bottom:1px solid var(--b)}
#dctl input[type=search]{grid-column:1/-1}
#dctl label{display:flex;gap:6px;align-items:center;color:var(--m);font-size:12px;grid-column:1/-1}
#dlist{flex:1;overflow:auto;padding:12px}
.card{border:1px solid var(--b);border-radius:var(--r);padding:11px;margin-bottom:9px;background:linear-gradient(#14171d,#101216)}
.card.on{border-color:var(--a)}
.card .h{display:flex;justify-content:space-between;gap:8px}
.card .h b{font-size:14px}
.card .spec{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
.card .spec span{font-size:11px;background:#0b0d11;border:1px solid var(--b);border-radius:5px;padding:1px 6px;color:#b6bdca}
.card .act{display:flex;gap:6px;align-items:center;margin-top:6px}
table.sp2{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.sp2 td{padding:3px 0;border-bottom:1px solid #1b1f27}
table.sp2 td:first-child{color:var(--m);width:42%}
table.sp2 .na{color:#6b7380}
/* detail card */
#detail{position:absolute;left:10px;bottom:62px;width:min(330px,calc(100% - 20px));max-height:56%;overflow:auto;z-index:6;background:#0f1217f8;border:1px solid var(--b2);border-radius:12px;padding:12px;display:none}
#detail.show{display:block}
.alt{display:inline-block;margin:3px 4px 0 0;font-size:11px}
dialog{background:#0f1217;color:var(--t);border:1px solid var(--b2);border-radius:14px;padding:18px;width:min(640px,94vw);max-height:86vh;box-shadow:0 30px 90px #000c}
dialog::backdrop{background:#000a;}
dialog h2{margin:0 0 10px;font-size:17px}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog textarea{width:100%;min-height:120px;background:#0c0e12;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px}
table.cmp{width:100%;border-collapse:collapse}
table.cmp td,table.cmp th{padding:5px 6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
table.cmp tr.diff td{background:#fbbf240d}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;background:#12151b;border:1px solid var(--b2);padding:9px 16px;border-radius:10px;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--bad)}
#toast.good{border-color:var(--ok)}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:56vh minmax(0,1fr)}
  #panel{border-left:0;border-top:1px solid var(--b)}
  #bname{width:130px}#gsearch{width:120px}
  #fid{display:none}
  #detail{bottom:58px;max-height:45%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- responsive + touch + perf overrides ---- */
html,body{height:100%;height:100dvh}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{touch-action:manipulation}
#pscroll,#dlist,#detail{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#top,#tbTop{scrollbar-width:none}#top::-webkit-scrollbar,#tbTop::-webkit-scrollbar{display:none}
.lbl{left:0;top:0;will-change:transform}
#ltb{display:none}
@media (max-width:1200px){main{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(230px,42dvh) minmax(0,1fr)}
  #top{padding:6px 8px}
  #tbTop{flex-wrap:nowrap;overflow-x:auto}
  #tbTop .chip{flex:none}
  #ltb{display:inline-block}
  #tbBot{display:none;right:10px;flex-wrap:wrap}
  #tbBot.open{display:flex}
  #gsearch{width:110px}
  #detail{left:8px;bottom:8px;max-height:62%}
}
@media (pointer:coarse){
  button,select,input:not([type=range]):not([type=checkbox]):not([type=color]){min-height:40px}
  input,select,textarea{font-size:16px}
  .chip{padding:8px 12px}
  .slot{padding:12px 10px}
  .slot .x{padding:8px 13px}
  #tbBot input[type=range]{width:110px}
  .sw{width:30px;height:30px;min-height:0}
}

/* ---- left menu (phone) + buy list ---- */
#rail{display:none}
#foot{max-height:50%;overflow:auto}
.row{align-items:center}
.buy{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1b1f27}
.buy .tx{flex:1;min-width:0}.buy .tx small{display:block;color:var(--m);font-size:10px;text-transform:uppercase}
.buy .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.amz{background:#ff9900;color:#111;font-weight:700;text-decoration:none;border-radius:8px;padding:8px 11px;font-size:12px;white-space:nowrap}
@media (max-width:900px){
  main{grid-template-columns:68px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  #rail{display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-right:1px solid var(--b);background:#0d0f13;grid-column:1;grid-row:1}
  #rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 2px;font-size:11px;line-height:1.1;border-radius:12px}
  #rail button b{font-size:22px;font-weight:400}
  #rail button[aria-selected=true]{border-color:var(--a);color:var(--a);background:#5eead414}
  #view,#panel{grid-column:2;grid-row:1}
  #panel{border-top:0}
  main[data-tab=view] #panel,main:not([data-tab=view]) #view{display:none}
  main[data-tab=parts] #foot{display:none}
  main[data-tab=price] #pscroll{display:none}
  main[data-tab=price] #foot{flex:1;max-height:none}
  #drawer{left:68px;width:auto}
}
</style>

{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

}}

<body>
<header id="top">
  <div class="brand"><i></i>PCForge<em>3D</em></div>
  <input id="bname" aria-label="Build name" maxlength="60">
  <span id="save" class="ok">Saved</span>
  <input id="gsearch" type="search" placeholder="Search all parts…" aria-label="Search all parts">
  <div class="sp"></div>
  <button id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
  <button id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
  <button id="bBuilds" title="Saved builds">Builds</button>
  <button id="bNew" title="Start a new build">New</button>
  <button id="bShare" title="Copy share link">Share</button>
  <button id="bExport" title="Download build as JSON">Export</button>
  <button id="bImport" title="Import build JSON">Import</button>
  <button id="bSet" title="Settings">Settings</button>
</header>
<main data-tab="view">
  <nav id="rail" aria-label="Sections"><button data-tab="view" aria-selected="true"><b>🖥️</b>Case</button><button data-tab="parts" aria-selected="false"><b>🧩</b>Parts</button><button data-tab="price" aria-selected="false"><b>💲</b>Price</button></nav>
  <section id="view" aria-label="3D viewport">
    <div id="gl" tabindex="0" aria-label="3D PC viewport. Press R to reset view, E to toggle exploded view."></div>
    <div id="labels"></div>
    <div id="tip"></div>
    <div id="tbTop" class="tb" role="toolbar" aria-label="View controls"></div>
    <button id="fs" class="chip" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
    <div id="tbBot" class="tb" aria-label="Lighting">
      <label>Light <input id="light" type="range" min="0.3" max="2" step="0.05" aria-label="Light intensity"></label>
      <label>BG <button class="sw" data-bg="0" style="background:#0a0b0e" aria-label="Graphite background"></button><button class="sw" data-bg="1" style="background:#0b1226" aria-label="Midnight background"></button><button class="sw" data-bg="2" style="background:#2a2e37" aria-label="Studio background"></button></label>
      <label>RGB <input id="rgbc" type="color" aria-label="RGB color"> <button id="rainbow" class="chip" aria-pressed="false">Rainbow</button></label>
    </div>
    <div id="fid"><b>Placeholder geometry.</b> 3D parts are generic procedural shapes sized from catalog data — not manufacturer models.</div>
    <div id="detail" role="region" aria-label="Component detail"></div>
    <div id="loading"><div><div class="spin"></div><div id="loadmsg">Loading 3D engine…</div></div></div>
  </section>
  <aside id="panel" aria-label="Build">
    <div id="pscroll"></div>
    <div id="foot"></div>
  </aside>
  <div id="drawer" role="dialog" aria-label="Component picker" aria-hidden="true">
    <header><b id="dtitle">Parts</b><button id="dclose" aria-label="Close picker">✕</button></header>
    <div id="dctl">
      <input id="dq" type="search" placeholder="Search name, brand, socket…" aria-label="Search parts">
      <select id="dsort" aria-label="Sort"><option value="price-asc">Price ↑</option><option value="price-desc">Price ↓</option><option value="name">Name</option><option value="brand">Brand</option></select>
      <select id="dbrand" aria-label="Manufacturer"></select>
      <label><input id="dcompat" type="checkbox"> Hide parts that conflict with my build</label>
    </div>
    <div id="dlist"></div>
  </div>
</main>
<dialog id="dlg"></dialog>
<input id="file" type="file" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   PCForge — single-file 3D PC configurator
   • Catalog below is DEMO DATA (fictional brands, placeholder prices/specs).
     Prices are NOT market prices. Import your own catalog in Settings.
   • 3D parts are procedural placeholders, not manufacturer models.
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------------- catalog (demo) ---------------- */
const CATS=[
 {id:'cpu',label:'CPU',ic:'CPU'},{id:'cooler',label:'CPU Cooler',ic:'COOL'},{id:'mobo',label:'Motherboard',ic:'MB'},
 {id:'ram',label:'Memory',ic:'RAM'},{id:'gpu',label:'Graphics Card',ic:'GPU'},{id:'storage',label:'Storage',ic:'SSD'},
 {id:'psu',label:'Power Supply',ic:'PSU'},{id:'case',label:'Case',ic:'CASE'}];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const D=(o)=>({currency:'USD',source:'Demo dataset (not a market price)',updated:'2026-10-28',demo:true,model:'procedural',...o});
const DEMO=[
 D({id:'cpu-n7',cat:'cpu',brand:'Nova',name:'Nova 7 8-Core',price:299,socket:'AM5',cores:8,threads:16,tdp:105,mem:['DDR5']}),
 D({id:'cpu-n5',cat:'cpu',brand:'Nova',name:'Nova 5 6-Core',price:199,socket:'AM5',cores:6,threads:12,tdp:65,mem:['DDR5']}),
 D({id:'cpu-h7',cat:'cpu',brand:'Helix',name:'Helix K7 12-Core',price:329,socket:'LGA1700',cores:12,threads:20,tdp:125,mem:['DDR4','DDR5']}),
 D({id:'cpu-h5',cat:'cpu',brand:'Helix',name:'Helix K5 10-Core',price:null,socket:'LGA1700',cores:10,threads:16,tdp:65,mem:['DDR4','DDR5']}),
 D({id:'mb-a1',cat:'mobo',brand:'Nova',name:'Nova X ATX',price:229,socket:'AM5',chipset:'X-Series',form:'ATX',memType:'DDR5',ramSlots:4,maxRam:192,m2:3,sata:4}),
 D({id:'mb-a2',cat:'mobo',brand:'Nova',name:'Nova B mATX',price:149,socket:'AM5',chipset:'B-Series',form:'mATX',memType:'DDR5',ramSlots:4,maxRam:128,m2:2,sata:4}),
 D({id:'mb-i1',cat:'mobo',brand:'Nova',name:'Nova B Mini-ITX',price:199,socket:'AM5',chipset:'B-Series',form:'ITX',memType:'DDR5',ramSlots:2,maxRam:64,m2:2,sata:2}),
 D({id:'mb-h1',cat:'mobo',brand:'Helix',name:'Helix Z ATX',price:259,socket:'LGA1700',chipset:'Z-Series',form:'ATX',memType:'DDR5',ramSlots:4,maxRam:128,m2:4,sata:6}),
 D({id:'mb-h2',cat:'mobo',brand:'Helix',name:'Helix B mATX (DDR4)',price:119,socket:'LGA1700',chipset:'B-Series',form:'mATX',memType:'DDR4',ramSlots:4,maxRam:128,m2:2,sata:4}),

const SPECS={
 cpu:[['socket','Socket'],['cores','Cores'],['threads','Threads'],['tdp','TDP',v=>v+' W'],['mem','Memory',v=>v.join(' / ')]],
 mobo:[['socket','Socket'],['chipset','Chipset'],['form','Form factor'],['memType','Memory'],['ramSlots','RAM slots'],['maxRam','Max RAM',v=>v+' GB'],['m2','M.2 slots'],['sata','SATA ports']],
 gpu:[['vram','VRAM',v=>v+' GB'],['length','Length',v=>v+' mm'],['slots','Slot width',v=>v+' slots'],['tdp','Board power',v=>v+' W'],['conn','8-pin PCIe',v=>v+'×']],
 ram:[['memType','Type'],['capacity','Kit',v=>v+' GB'],['modules','Modules',v=>v+'×'],['speed','Speed',v=>v+' MT/s'],['cl','CAS',v=>'CL'+v]],
 cooler:[['kind','Type'],['height','Height',v=>v+' mm'],['radiator','Radiator',v=>v+' mm'],['sockets','Sockets',v=>v.join(', ')],['tdp','Rated for',v=>v+' W']],
 case:[['dims','Size W×H×D',v=>v.join('×')+' mm'],['mobo','Boards',v=>v.join(', ')],['gpuMax','Max GPU',v=>v+' mm'],['coolerMax','Max cooler',v=>v+' mm'],['psu','PSU form',v=>v.join(', ')],['psuMax','Max PSU length',v=>v+' mm'],['rad','Top radiator',v=>v.length?v.join(', ')+' mm':'none'],['panel','Side panel']],
 psu:[['watts','Rated',v=>v+' W'],['form','Form factor'],['length','Length',v=>v+' mm'],['eff','Efficiency'],['pcie','PCIe 8-pin',v=>v+'×']],

const fmt=(v,c='USD')=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:v%1?2:0}).format(v)}catch{return c+' '+v}};
function total(parts){
  let sum=0,known=0,missing=[],excluded=[];const cc=O.currency;
  for(const c of CATS){const p=byId[parts[c.id]];if(!p)continue;
    if(p.price==null){missing.push(p.name);continue}
    if(p.currency!==cc){excluded.push(p.name+' ('+p.currency+')');continue}
    sum+=p.price;known++}
  const tax=O.tax>0?sum*O.tax/100:0,ship=O.ship>0?+O.ship:0;
  return{sum,known,missing,excluded,tax,ship,grand:sum+tax+ship,cc};
}
const ageDays=p=>(Date.now()-Date.parse(p.updated))/864e5;
function priceHTML(p){
  if(p.price==null)return'<span class="muted">Price unavailable</span>';
  const stale=!isNaN(ageDays(p))&&ageDays(p)>30;
  return`<b>${fmt(p.price,p.currency)}</b> <span class="badge b-demo" title="${esc(p.source)}">${p.demo?'DEMO':'IMPORTED'}</span>${stale?' <span class="badge b-warning">STALE</span>':''}`;
}

/* ---------------- compatibility engine ---------------- */
const LV={compatible:0,unknown:1,warning:2,incompatible:3};
function power(b){
  const g=c=>byId[b[c]];const cpu=g('cpu'),gpu=g('gpu');
  const known=[cpu?.tdp,gpu?.tdp].filter(v=>typeof v==='number');
  if(!known.length)return null;
  return{watts:known.reduce((a,v)=>a+v,0)+75,complete:!!(cpu&&gpu&&typeof cpu.tdp==='number'&&typeof gpu.tdp==='number'),cpu:cpu?.tdp,gpu:gpu?.tdp};
}
function analyze(b){
  const g=c=>byId[b[c]];const out=[];
  const add=(level,id,title,reason,parts,evidence,fix)=>out.push({level,id,title,reason,parts,evidence,fix:fix||''});
  const cpu=g('cpu'),mb=g('mobo'),ram=g('ram'),gpu=g('gpu'),cl=g('cooler'),cs=g('case'),psu=g('psu'),st=g('storage');
  const has=v=>v!==undefined&&v!==null;
  if(cpu&&mb){
    if(!cpu.socket||!mb.socket)add('unknown','socket','CPU socket unverified','Socket data is missing for one of the parts.',['cpu','mobo'],'No socket field.','Check the manufacturer spec sheet.');
    else if(cpu.socket!==mb.socket)add('incompatible','socket','CPU / motherboard socket mismatch',`${cpu.name} uses ${cpu.socket} but ${mb.name} has a ${mb.socket} socket.`,['cpu','mobo'],`CPU: ${cpu.socket} · Board: ${mb.socket}`,`Pick a ${cpu.socket} motherboard or a ${mb.socket} CPU.`);
    else add('compatible','socket','CPU socket matches',`Both use ${cpu.socket}.`,['cpu','mobo'],`${cpu.socket} = ${mb.socket}`);
    if(cpu.socket===mb.socket)add('unknown','bios','BIOS / chipset support not verified','The catalog has no verified CPU-support list for this board, so BIOS compatibility is unknown.',['cpu','mobo'],'No BIOS data in dataset.','Check the board vendor’s CPU support list.');
  }
  if(ram&&mb){
    if(!ram.memType||!mb.memType)add('unknown','ramtype','Memory type unverified','Missing memory type data.',['ram','mobo'],'','');
    else if(ram.memType!==mb.memType)add('incompatible','ramtype','Memory generation mismatch',`${ram.name} is ${ram.memType} but ${mb.name} supports ${mb.memType}.`,['ram','mobo'],`RAM: ${ram.memType} · Board: ${mb.memType}`,`Choose ${mb.memType} memory or a ${ram.memType} board.`);
    else add('compatible','ramtype','Memory type matches',`${ram.memType} on both.`,['ram','mobo'],`${ram.memType}`);
    if(has(ram.modules)&&has(mb.ramSlots)){ if(ram.modules>mb.ramSlots)add('incompatible','ramslots','Not enough memory slots',`Kit has ${ram.modules} modules, board has ${mb.ramSlots} slots.`,['ram','mobo'],`${ram.modules} > ${mb.ramSlots}`,'Pick a kit with fewer modules.')}
    if(has(ram.capacity)&&has(mb.maxRam)&&ram.capacity>mb.maxRam)add('incompatible','ramcap','Memory exceeds board limit',`${ram.capacity} GB kit vs ${mb.maxRam} GB max.`,['ram','mobo'],`${ram.capacity} > ${mb.maxRam} GB`,'Choose a smaller kit.');
  }
  if(ram&&cpu&&cpu.mem&&ram.memType&&!cpu.mem.includes(ram.memType))add('incompatible','cpumem','CPU does not support this memory',`${cpu.name} supports ${cpu.mem.join('/')}; kit is ${ram.memType}.`,['ram','cpu'],`Supported: ${cpu.mem.join(', ')}`,'Choose a supported memory type.');
  if(mb&&cs){
    if(!cs.mobo||!mb.form)add('unknown','form','Board size unverified','Missing form-factor data.',['mobo','case'],'','');
    else if(!cs.mobo.includes(mb.form))add('incompatible','form','Motherboard does not fit the case',`${cs.name} supports ${cs.mobo.join(', ')}; ${mb.name} is ${mb.form}.`,['mobo','case'],`Board: ${mb.form}`,'Pick a larger case or a smaller board.');
    else add('compatible','form','Board form factor fits',`${mb.form} is supported.`,['mobo','case'],`${mb.form} ∈ [${cs.mobo.join(', ')}]`);
  }
  if(gpu&&cs){
    if(!has(gpu.length)||!has(cs.gpuMax))add('unknown','gpulen','GPU clearance unverified','Missing GPU length or case clearance.',['gpu','case'],'','');
    else if(gpu.length>cs.gpuMax)add('incompatible','gpulen','GPU too long for case',`${gpu.name} is ${gpu.length} mm; ${cs.name} allows ${cs.gpuMax} mm.`,['gpu','case'],`${gpu.length} mm > ${cs.gpuMax} mm`,'Choose a shorter GPU or a roomier case.');
    else if(cs.gpuMax-gpu.length<10)add('warning','gpulen','Tight GPU clearance',`Only ${cs.gpuMax-gpu.length} mm spare — front fans/radiators or cables may interfere.`,['gpu','case'],`${gpu.length} of ${cs.gpuMax} mm`,'Leave more margin if you plan a front radiator.');
    else add('compatible','gpulen','GPU length fits',`${cs.gpuMax-gpu.length} mm spare.`,['gpu','case'],`${gpu.length} ≤ ${cs.gpuMax} mm`);
    if(has(gpu.slots)&&has(cs.slots)&&Math.ceil(gpu.slots)>cs.slots)add('incompatible','gpuslot','Not enough expansion slots',`${gpu.slots}-slot card in a ${cs.slots}-slot case.`,['gpu','case'],'','Choose a thinner card.');
  }
  if(cl&&cpu){
    if(!cl.sockets||!cpu.socket)add('unknown','clsock','Cooler socket unverified','Missing socket data.',['cooler','cpu'],'','');
    else if(!cl.sockets.includes(cpu.socket))add('incompatible','clsock','Cooler does not support the CPU socket',`${cl.name} supports ${cl.sockets.join(', ')}; CPU is ${cpu.socket}.`,['cooler','cpu'],'','Pick a cooler with a matching mounting kit.');
    else add('compatible','clsock','Cooler socket supported',`${cpu.socket} supported.`,['cooler','cpu'],cl.sockets.join(', '));
    if(has(cl.tdp)&&has(cpu.tdp)&&cl.tdp<cpu.tdp)add('warning','cltdp','Cooler may be undersized',`${cl.name} is rated for ${cl.tdp} W; CPU TDP is ${cpu.tdp} W.`,['cooler','cpu'],`${cl.tdp} < ${cpu.tdp} W`,'Choose a higher-rated cooler.');
  }
  if(cl&&cs){
    if(cl.radiator){
      if(!cs.rad)add('unknown','rad','Radiator support unverified','No radiator data for this case.',['cooler','case'],'','');
      else if(!cs.rad.includes(cl.radiator))add('incompatible','rad','Radiator not supported',`${cl.name} needs a ${cl.radiator} mm radiator mount; case supports ${cs.rad.length?cs.rad.join('/')+' mm':'none'}.`,['cooler','case'],'','Pick a smaller radiator or another case.');
      else add('compatible','rad','Radiator fits',`${cl.radiator} mm top mount supported.`,['cooler','case'],'');
    }else if(has(cl.height)&&has(cs.coolerMax)){
      if(cl.height>cs.coolerMax)add('incompatible','clh','Cooler too tall',`${cl.name} is ${cl.height} mm; case allows ${cs.coolerMax} mm.`,['cooler','case'],`${cl.height} > ${cs.coolerMax} mm`,'Pick a lower-profile cooler or a wider case.');
      else add('compatible','clh','Cooler height fits',`${cs.coolerMax-cl.height} mm spare.`,['cooler','case'],`${cl.height} ≤ ${cs.coolerMax} mm`);
    }
  }
  if(psu&&cs){
    if(cs.psu&&psu.form&&!cs.psu.includes(psu.form))add('incompatible','psuform','PSU form factor not supported',`${cs.name} takes ${cs.psu.join('/')}; PSU is ${psu.form}.`,['psu','case'],'','Choose a matching PSU form factor.');
    else if(cs.psu&&psu.form)add('compatible','psuform','PSU form factor fits',psu.form,['psu','case'],'');
    if(has(psu.length)&&has(cs.psuMax)&&psu.length>cs.psuMax)add('incompatible','psulen','PSU too long',`${psu.length} mm vs ${cs.psuMax} mm allowed.`,['psu','case'],'','Pick a shorter PSU.');
  }
  const pw=power(b);
  if(psu&&pw){
    if(!has(psu.watts))add('unknown','watt','PSU rating unknown','',['psu'],'','');
    else if(pw.watts>psu.watts)add('incompatible','watt','PSU too small',`Estimated peak ≈ ${pw.watts} W exceeds the ${psu.watts} W rating.`,['psu','cpu','gpu'],`Estimate ${pw.watts} W vs ${psu.watts} W`,'Choose a higher-wattage PSU.');
    else if(pw.watts*1.25>psu.watts)add('warning','watt','Low PSU headroom',`Estimated ≈ ${pw.watts} W on a ${psu.watts} W unit (${Math.round((1-pw.watts/psu.watts)*100)}% headroom). 25%+ is recommended.`,['psu','cpu','gpu'],`${pw.watts}/${psu.watts} W`,'Pick a PSU with more capacity.');
    else add('compatible','watt','PSU capacity OK',`≈ ${pw.watts} W of ${psu.watts} W (${Math.round((1-pw.watts/psu.watts)*100)}% headroom).`,['psu'],'Estimate, not measured.');
    if(!pw.complete)add('unknown','watt2','Power estimate incomplete','Add both a CPU and a GPU for a meaningful estimate.',['psu'],'','');
  }
  if(psu&&gpu&&has(gpu.conn)&&has(psu.pcie)){
    if(gpu.conn>psu.pcie)add('incompatible','conn','Missing GPU power connectors',`${gpu.name} needs ${gpu.conn}× 8-pin PCIe; ${psu.name} provides ${psu.pcie}.`,['psu','gpu'],`${gpu.conn} > ${psu.pcie}`,'Choose a PSU with more PCIe connectors.');
    else add('compatible','conn','GPU power connectors available',`${gpu.conn}× needed, ${psu.pcie}× provided.`,['psu','gpu'],'');
  }
  if(st&&mb){
    if(st.iface==='NVMe'&&has(mb.m2)&&mb.m2<1)add('incompatible','m2','No M.2 slot','',['storage','mobo'],'','');
    if(st.iface==='SATA'&&has(mb.sata)&&mb.sata<1)add('incompatible','sata','No SATA ports','',['storage','mobo'],'','');
  }
  if(st&&cs){
    if(st.form==='3.5"'&&has(cs.bays35)&&cs.bays35<1)add('incompatible','bay','No 3.5" drive bay',`${cs.name} has no 3.5" bays.`,['storage','case'],'','Choose an SSD or a different case.');
    if(st.form==='2.5"'&&has(cs.bays25)&&cs.bays25<1)add('incompatible','bay','No 2.5" drive bay','',['storage','case'],'','Choose an M.2 drive.');
  }
  return out;
}
const worst=list=>list.reduce((a,i)=>Math.max(a,LV[i.level]),0);
const lvName=n=>Object.keys(LV).find(k=>LV[k]===n);
function conflictsFor(cat,p){ // would swapping this part cause problems with the rest of the build?
  const b={...cur().parts,[cat]:p.id};
  return analyze(b).filter(i=>i.parts.includes(cat)&&(i.level==='incompatible'||i.level==='warning'));
}

/* ---------------- UI: panel ---------------- */
function specRows(p){return(SPECS[p.cat]||[]).map(([k,l,f])=>{const v=p[k];return[l,v==null?null:(f?f(v):v)]})}
function refresh(){renderPanel();renderFoot();renderDetail();$('#bname').value!==cur().name&&($('#bname').value=cur().name);$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length;if(drawerCat!==undefined)renderDrawer();build3D()}
function renderPanel(){
  const b=cur().parts,an=analyze(b),filled=CATS.filter(c=>b[c.id]).length;
  const bad=an.filter(i=>i.level!=='compatible');
  let h='';
  if(!filled)h+=`<div class="empty"><b style="color:var(--t)">Start your build</b><br>Pick parts one by one, or load a ready-made compatible demo build.<div class="btns"><button class="pri" data-preset="gaming">Gaming ATX</button><button data-preset="ent">Enthusiast</button><button data-preset="mini">Mini-ITX</button></div></div>`;
  h+=`<h3>Components · ${filled}/${CATS.length}</h3><div class="bar" style="margin-bottom:10px"><i style="width:${filled/CATS.length*100}%"></i></div>`;
  for(const c of CATS){
    const p=byId[b[c.id]];const iss=p?an.filter(i=>i.parts.includes(c.id)&&i.level!=='compatible'):[];const w=iss.length?lvName(worst(iss)):'';
    h+=`<div class="slot ${p?'has':''} ${sel===c.id?'sel':''}" data-slot="${c.id}" tabindex="0" role="button" aria-label="${c.label}: ${p?esc(p.name):'empty'}">
      <div class="ic">${c.ic}</div>
      <div class="tx"><small>${c.label}</small><b>${p?esc(p.name):'<span class="muted" style="font-weight:400">Choose…</span>'}</b></div>
      <div class="pr">${p?(p.price==null?'<span class="muted">n/a</span>':fmt(p.price,p.currency))+(w?`<br><span class="badge b-${w}">${w}</span>`:''):''}</div>
      ${p?`<button class="x" data-rm="${c.id}" aria-label="Remove ${c.label}" title="Remove">✕</button>`:''}</div>`;
  }
  h+=`<h3 style="margin-top:16px">Compatibility</h3>`;
  const missing=CATS.filter(c=>!b[c.id]);
  if(missing.length&&filled)h+=`<div class="issue unknown"><b>Missing parts</b><small>${missing.map(c=>c.label).join(' · ')}</small></div>`;
  if(!bad.length&&filled>1)h+=`<div class="issue compatible"><b>No problems found</b><small>${an.length} check(s) passed. Unverified items are shown as “unknown”.</small></div>`;
  if(filled<2)h+=`<div class="muted">Add two or more parts to see compatibility checks.</div>`;
  const ord=[...bad].sort((a,b)=>LV[b.level]-LV[a.level]);
  for(const i of ord)h+=issueHTML(i);
  const ok=an.filter(i=>i.level==='compatible');
  if(ok.length)h+=`<details><summary>${ok.length} passed check(s)</summary>${ok.map(issueHTML).join('')}</details>`;
  h+=`<div class="muted" style="font-size:11px;margin-top:12px">Rules are explicit and based only on catalog fields. Missing data stays “unknown” — it is never assumed compatible.</div>`;
  {const ps=$('#pscroll'),sc=ps.scrollTop;ps.innerHTML=h;ps.scrollTop=sc}
}

function openDrawer(cat,q=''){

  $('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');renderDrawer();
  setTimeout(()=>$('#dq').focus(),250);
}
function closeDrawer(){drawerCat=undefined;$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}
function renderDrawer(){
  if(drawerCat===undefined)return;
  const q=$('#dq').value.trim().toLowerCase(),brand=$('#dbrand').value,sort=$('#dsort').value,hide=$('#dcompat').checked;
  let list=catalog.filter(p=>(!drawerCat||p.cat===drawerCat)&&(!brand||p.brand===brand));
  if(q)list=list.filter(p=>[p.name,p.brand,p.socket,p.memType,p.form,p.iface,p.kind,p.cat,CAT[p.cat].label,...(p.aliases||[])].join(' ').toLowerCase().includes(q));
  const items=list.map(p=>({p,iss:conflictsFor(p.cat,p)}));
  let shown=hide?items.filter(x=>!x.iss.some(i=>i.level==='incompatible')):items;
  const pr=p=>p.price==null?Infinity:p.price;
  shown.sort((a,b)=>sort==='price-asc'?pr(a.p)-pr(b.p):sort==='price-desc'?(b.p.price??-1)-(a.p.price??-1):sort==='brand'?a.p.brand.localeCompare(b.p.brand)||a.p.name.localeCompare(b.p.name):a.p.name.localeCompare(b.p.name));
  const b=cur().parts;
  $('#dlist').innerHTML=shown.length?shown.map(({p,iss})=>{
    const lv=iss.length?lvName(worst(iss)):(CATS.filter(c=>c.id!==p.cat&&b[c.id]).length?'compatible':'unknown');
    const on=b[p.cat]===p.id;
    return`<div class="card ${on?'on':''}"><div class="h"><div><small class="muted">${CAT[p.cat].label} · ${esc(p.brand)}</small><br><b>${esc(p.name)}</b></div><div style="text-align:right">${priceHTML(p)}</div></div>

    <div class="act"><span class="badge b-${lv}" title="Compatibility with your current selection">${lv==='compatible'?'fits build':lv}</span><span class="sp"></span>
      <button data-exp="${p.id}">${expanded.has(p.id)?'Hide':'Details'}</button>
      ${on?`<button data-rm="${p.cat}">Remove</button>`:`<button class="pri" data-pick="${p.id}">Select</button>`}</div>
    ${expanded.has(p.id)?`<table class="sp2">${specRows(p).map(([l,v])=>`<tr><td>${l}</td><td class="${v==null?'na':''}">${v==null?'unknown':esc(v)}</td></tr>`).join('')}<tr><td>Source</td><td>${esc(p.source)} · ${esc(p.updated)}</td></tr><tr><td>3D preview</td><td>Generic placeholder</td></tr></table>`:''}</div>`}).join('')

function validateBuild(d){
  if(!d||typeof d!=='object')throw Error('File is not a valid build object.');
  if(d.schema!=='pcforge.build')throw Error('Not a PCForge build file.');
  if(typeof d.version!=='number')throw Error('Missing schema version.');
  if(d.version>1)throw Error('This file was made by a newer PCForge (schema v'+d.version+').');
  if(!d.parts||typeof d.parts!=='object')throw Error('Missing parts.');
  const parts={},skipped=[];
  for(const[k,v]of Object.entries(d.parts)){if(CAT[k]&&byId[v]&&byId[v].cat===k)parts[k]=v;else skipped.push(k+':'+v)}
  return{name:String(d.name||'Imported build').slice(0,60),parts,skipped};
}

function loadFromHash(){

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-slot]');if(!t)return;
  if(t.dataset.preset){setParts({...PRESETS[t.dataset.preset]});return}
  if(t.dataset.rm){e.stopPropagation();setPart(t.dataset.rm,null);return}
  if(t.dataset.pick){const p=byId[t.dataset.pick];setPart(p.cat,p.id);sel=p.cat;focusCat(p.cat);if(drawerCat===null){}closeDrawer();return}
  if(t.dataset.exp){expanded.has(t.dataset.exp)?expanded.delete(t.dataset.exp):expanded.add(t.dataset.exp);renderDrawer();return}
  if(t.dataset.swap){const p=byId[t.dataset.swap];setPart(p.cat,p.id);return}
  if(t.dataset.change){openDrawer(t.dataset.change);return}
  if(t.dataset.bo){store.current=t.dataset.bo;hist=[];fut=[];sel=null;persist();refresh();dlg.close();return}
  if(t.dataset.bd){const b=store.builds.find(x=>x.id===t.dataset.bd);newBuild(b.name+' (copy)',{...b.parts});buildsDialog();return}
  if(t.dataset.bx){if(store.builds.length<2)return;if(!confirm('Delete this build?'))return;store.builds=store.builds.filter(x=>x.id!==t.dataset.bx);if(store.current===t.dataset.bx)store.current=store.builds[0].id;persist();refresh();buildsDialog();return}
  if(t.dataset.bc){compareDialog(t.dataset.bc);return}
  if(t.dataset.bl!==undefined){buildsDialog();return}
  if(t.id==='dx'){sel=null;renderPanel();renderDetail();return}

  // highlights
  const show=(h,c)=>{if(c&&S.groups[c]){h.box.copy(catBox(c));h.visible=!h.box.isEmpty()}else h.visible=false};
  {const hc=hoverCat&&hoverCat!==sel?hoverCat:null,hk=hc+'|'+sel+'|'+S.k.toFixed(3)+'|'+S.sig;if(hk!==S.hk){S.hk=hk;show(hoverBox,hc);show(selBox,sel)}}
  // labels
  if(O.labels){const w=$('#view').clientWidth,h=$('#view').clientHeight;
    for(const l of $('#labels').children){const c=l.dataset.cat,a=S.anchor[c];if(!a){continue}
      const off=S.groups[c]?.[0]?.position||new THREE.Vector3();const v=(S._v||(S._v=new THREE.Vector3())).copy(a).add(off).project(camera);
      const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;l.style.display=vis?'':'none';
      l.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px) translate(-50%,-100%)`;l.style.opacity=sel&&sel!==c?.4:1}}
  if(LOW()||!composer)renderer.render(scene,camera);else composer.render(dt);
}

/* ---------------- boot ---------------- */
let TAB='view';const mq=matchMedia('(max-width:900px)');
function setTab(t){TAB=t;$('main').dataset.tab=t;document.querySelectorAll('#rail button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));if(t==='view'){S.rk='';S.shadowDirty=true;setTimeout(resize3D,30)}}
$('#rail').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
renderToolbar();
$('#bname').value=cur().name;
// before 3D is ready, refresh() must not touch the scene
refresh();
loadFromHash();
window.pcforge={analyze,total,power,catalog:()=>catalog,get build(){return cur()}};
init3D().then(()=>{if(S.ok){refresh();}}).catch(e=>fail3D('3D failed to start: '+e.message));
</script>
